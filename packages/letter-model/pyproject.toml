[project]
name = "letter-model"
version = "0.1.0"
description = "Train the on-device letter model for your-own-font (stroke group -> letter or not-one-letter)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "numba>=0.60",
  "torch>=2.4",
  "pillow>=10.4",
]

[project.scripts]
letter-model = "letter_model.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/letter_model"]

